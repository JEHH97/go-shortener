name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Run project checks
        run: make check
