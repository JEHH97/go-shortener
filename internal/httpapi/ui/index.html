<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Go Shortener</title>
<style>body{font:16px system-ui,sans-serif;max-width:760px;margin:4rem auto;padding:0 1rem;color:#172033;background:#f5f7fb}main{background:white;border:1px solid #dce3ee;border-radius:14px;padding:2rem;box-shadow:0 12px 40px #1c315012}h1{margin-top:0}label{display:block;margin:.9rem 0 .35rem;font-weight:600}input{box-sizing:border-box;width:100%;padding:.75rem;border:1px solid #b8c5d8;border-radius:7px}button{margin-top:1rem;padding:.75rem 1rem;border:0;border-radius:7px;background:#315ee8;color:white;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5fa;padding:1rem;border-radius:8px}small{color:#59677c}</style></head>
<body><main><h1>Short links, clear signals.</h1><p>Create a compact redirect and inspect aggregate click activity.</p>
<form id="create"><label for="url">Destination URL</label><input id="url" type="url" required placeholder="https://example.org/article"><label for="alias">Custom alias (optional)</label><input id="alias" maxlength="32" placeholder="launch-notes"><button>Create link</button></form><pre id="result">Your new link will appear here.</pre>
<form id="stats"><label for="code">Short code to inspect</label><input id="code" required placeholder="a1B2c3D"><button>Load stats</button></form><pre id="report">Click aggregates will appear here.</pre><small>Stats are collected asynchronously; updates may take a moment.</small></main>
<script>const out=document.querySelector('#result');document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const body={url:document.querySelector('#url').value,alias:document.querySelector('#alias').value};const r=await fetch('/api/links',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});out.textContent=JSON.stringify(await r.json(),null,2)};document.querySelector('#stats').onsubmit=async e=>{e.preventDefault();const code=encodeURIComponent(document.querySelector('#code').value);const r=await fetch(`/api/links/${code}/stats`);document.querySelector('#report').textContent=JSON.stringify(await r.json(),null,2)};</script></body></html>
