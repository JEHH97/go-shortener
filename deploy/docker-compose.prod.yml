services:
  app:
    image: ghcr.io/jehh97/go-shortener:${GO_SHORTENER_VERSION:-v1.0.1}
    environment:
      APP_ADDR: :8080
      BASE_URL: ${BASE_URL:?Set BASE_URL in deploy/.env}
      API_KEY: ${API_KEY:?Set API_KEY in deploy/.env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/.env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in deploy/.env}
      RATE_LIMIT: ${RATE_LIMIT:-10}
      RATE_WINDOW: ${RATE_WINDOW:-1m}
      LOG_LEVEL: info
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/shortener", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 128m
    pids_limit: 64

  postgres:
    image: postgres:17.12-alpine3.24
    user: postgres
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    mem_limit: 512m
    pids_limit: 128

  redis:
    image: redis:7.4.12-alpine3.22
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 128m
    pids_limit: 64

volumes:
  postgres-data:
  redis-data:
