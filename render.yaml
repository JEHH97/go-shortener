services:
  - type: web
    name: go-shortener
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ADDR
        value: :8080
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: go-shortener-redis
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: RATE_LIMIT
        value: 10
      - key: RATE_WINDOW
        value: 1m
  - type: keyvalue
    name: go-shortener-redis
    plan: free
    ipAllowList: []
